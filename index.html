<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>degottlich</title>
  <meta name="description" content="Hi.">
  <style>
    :root {
      /* Tamanho de 1 pixel do design original na tela atual (mesma escala do fundo "cover") */
      --s: max(100vw / 1366, 100dvh / 768);
      --fade-out: 0.7s;
      --fade-in: 0.9s;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }

    /* Design original (desing_site.png) como fundo, sem alterações */
    .stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #000 url("desing_site.png") center / cover no-repeat;
      overflow: hidden;
    }

    /* Faixas ornamentadas sempre coladas no topo e na base, em qualquer tela */
    .faixa {
      position: fixed;
      left: 0;
      right: 0;
      height: calc(var(--s) * 34);
      background-color: #000;
      background-image: url("desing_site.png");
      background-size: calc(var(--s) * 1366) auto;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 2;
    }
    .faixa.topo { top: 0;    background-position: center top; }
    .faixa.base { bottom: 0; background-position: center bottom; }

    /* As 3 etapas ficam empilhadas no mesmo lugar; só uma aparece por vez */
    .item {
      grid-area: 1 / 1;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--fo, var(--fade-out)) ease, visibility 0s linear var(--fo, var(--fade-out));
    }
    .item.visivel {
      opacity: 1;
      visibility: visible;
      transition: opacity var(--fade-in) ease, visibility 0s;
    }
    /* o texto some mais devagar, porque logo depois abre o player */
    #texto { --fo: 1.6s; }

    button.item {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button.item:focus-visible {
      outline: 1px dashed rgba(255, 255, 255, 0.5);
      outline-offset: 6px;
    }

    .item img {
      display: block;
      height: auto;
      border: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    #gif2  img { width: min(229px, 60vw); aspect-ratio: 229 / 297; }
    #texto img { width: min(708px, 90vw); }

    /* ================= PLAYER (design do Figma) ================= */
    .win {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 5;
      transform-origin: 0 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: visibility 0s linear 0.55s;
    }
    .win.open {
      visibility: visible;
      pointer-events: auto;
      transition: visibility 0s;
    }
    .win-in {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.96) translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .win.open .win-in {
      opacity: 1;
      transform: none;
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.16, 0.84, 0.3, 1);
    }

    .row { display: flex; flex: none; position: relative; }
    .r-title  { height: 29px; touch-action: none; cursor: grab; }
    .r-menu   { height: 25px; }
    .r-ctrl   { height: 61px; }
    .r-status { height: 39px; }
    .win.dragging .r-title { cursor: grabbing; }

    .cap { flex: none; position: relative; background-repeat: no-repeat; background-size: 100% 100%; }
    .mid { flex: 1; min-width: 0; background-repeat: no-repeat; background-size: 100% 100%;
           margin-left: var(--ov, 0px); margin-right: var(--ov, 0px); }
    .row + .row { margin-top: var(--ov, 0px); }

      border-radius: 3px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .hs:hover  { background-color: rgba(255, 255, 255, 0.28); }
    .hs:active { background-color: rgba(0, 0, 0, 0.13); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45); }
    .hs.on     { background-color: rgba(0, 0, 0, 0.10); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4); }
    .hs:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }

    .hs.btn  { top: 21px; width: 29px; height: 25px; }
    .hs.play  { left: 27px; }
    .hs.pause { left: 58px; }
    .hs.stop  { left: 89px; }
    .hs.prev  { left: 124px; }
    .hs.next  { left: 155px; }

    .hs.close { left: 78px; top: 8px; width: 19px; height: 20px; border-radius: 2px; }
    .hs.close:hover  { background-color: rgba(255, 255, 255, 0.2); }
    .hs.close:active { background-color: rgba(0, 0, 0, 0.22); }

    .hs.mute { left: 24px; top: 23px; width: 20px; height: 20px; }
    .hs.mute::after {
      content: "";
      position: absolute;
      left: 4px; top: 5px; width: 13px; height: 11px;
      background: rgba(212, 208, 200, 0.72);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .hs.mute.off::after { opacity: 1; }

    /* slider de volume (mesmas cores do que estava desenhado no design) */
    .vol-hit {
      position: absolute;
      left: 43px; top: 21px; width: 89px; height: 25px;
      cursor: pointer;
      touch-action: none;
    }
    .vol-hit:focus-visible { outline: 1px dotted #000; outline-offset: -2px; }
    .vol-track {
      position: absolute;
      left: 4px; top: 8px; width: 81px; height: 9px;
      box-sizing: border-box;
      border: 1px solid #aaa8a4;
      background: linear-gradient(to bottom, #949290 0 1px, #a8a5a0 1px 6px, #949290 6px 7px);
      pointer-events: none;
    }
    .vol-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 55px;
      background: linear-gradient(to bottom,
        #5c7794 0 1px, #366aae 1px 2px, #3268b7 2px 3px,
        #2f66c1 3px 4px, #2b63ca 4px 5px, #2760d2 5px 6px, #526fad 6px 7px);
      transition: width 0.15s ease;
    }
    .vol-hit.drag .vol-fill { transition: none; }

    .grip { position: absolute; inset: 0; }

    @media (prefers-reduced-motion: reduce) {
      :root { --fade-out: 0.01s; --fade-in: 0.01s; }
      #texto { --fo: 0.01s; }
      .win-in, .win.open .win-in { transition-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <div class="faixa topo" aria-hidden="true"></div>

  <main class="stage">
    <!-- Etapa 1: GIF do rosto (clique) -->
    <button class="item" id="gif2" type="button" aria-label="Clique para continuar">
      <img src="gif2.gif" alt="Desenho de um rosto assustado espiando por baixo do cobertor" width="229" height="297" draggable="false">
    </button>

    <!-- Etapa 2: texto (clique abre o player) -->
    <button class="item" id="texto" type="button" aria-label="Abrir o player">
      <img src="destroy-your-life.png" alt="Destroy your life" width="708" height="70" draggable="false">
    </button>
  </main>

  <div class="faixa base" aria-hidden="true"></div>

  <!-- Player (janela arrastável e redimensionável) -->
  <div class="win" id="win" role="dialog" aria-label="retarded / player" aria-hidden="true">
    <div class="win-in">
      <div class="row r-title" id="dragbar">
        <div class="cap t-l"></div>
        <div class="mid t-m"></div>
        <div class="cap t-r">
          <button class="hs close" id="btnClose" type="button" aria-label="Fechar janela"></button>
        </div>
      </div>

      <div class="row r-menu">
        <div class="cap m-l"></div>
        <div class="mid m-m"></div>
        <div class="cap m-r"></div>
      </div>

      <div class="row r-screen">
        <div class="video-box">
          <video id="vid" class="hide" playsinline preload="metadata"></video>
        </div>
        <div class="frame"></div>
      </div>

      <div class="row r-ctrl">
        <div class="cap c-l">
          <button class="hs btn play"  id="btnPlay"  type="button" aria-label="Reproduzir"></button>
          <button class="hs btn pause" id="btnPause" type="button" aria-label="Pausar"></button>
          <button class="hs btn stop"  id="btnStop"  type="button" aria-label="Parar"></button>
          <button class="hs btn prev"  id="btnPrev"  type="button" aria-label="Vídeo anterior"></button>
          <button class="hs btn next"  id="btnNext"  type="button" aria-label="Próximo vídeo"></button>
        </div>
        <div class="mid c-m"></div>
        <div class="cap c-r">
          <button class="hs mute" id="btnMute" type="button" aria-label="Silenciar"></button>
          <div class="vol-hit" id="vol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
            <div class="vol-track"><div class="vol-fill" id="volFill"></div></div>
          </div>
        </div>
      </div>

      <div class="row r-status">
        <div class="cap b-l"></div>
        <div class="mid b-m"></div>
        <div class="cap b-r" id="grip" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      /* ---------- Sequência de cliques ---------- */
      var FADE_OUT_MS  = 700;    // igual a --fade-out
      var FADE_IN_MS   = 900;    // igual a --fade-in
      var TEXT_OUT_MS  = 1600;   // o texto some devagar antes do player abrir
      var WIN_OUT_MS   = 550;    // fade-out da janela ao fechar

      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { FADE_OUT_MS = FADE_IN_MS = TEXT_OUT_MS = WIN_OUT_MS = 20; }

      var gif2  = document.getElementById('gif2');
      var texto = document.getElementById('texto');
      var ocupado = false;

      // Carrega antes as imagens das próximas etapas para não piscar
      new Image().src = 'gif2.gif';
      new Image().src = 'destroy-your-life.png';

      // Entrada inicial: o GIF do rosto aparece com fade in
      setTimeout(function () { gif2.classList.add('visivel'); }, 300);

      function trocar(de, para, msOut, aoMostrar) {
        ocupado = true;
        de.classList.remove('visivel');
        setTimeout(function () {
          if (aoMostrar) aoMostrar();
          para.classList.add('visivel');
          setTimeout(function () { ocupado = false; }, FADE_IN_MS);
        }, msOut);
      }

      // Clique 1: o GIF some -> aparece o texto
      gif2.addEventListener('click', function () {
        if (ocupado) return;
        trocar(gif2, texto, FADE_OUT_MS);
      });

      // Clique 2: o texto some devagar -> abre o player
      texto.addEventListener('click', function () {
        if (ocupado) return;
        ocupado = true;
        texto.classList.remove('visivel');
        setTimeout(function () {
          abrirPlayer();
          ocupado = false;
        }, TEXT_OUT_MS);
      });

      /* ---------- Player ---------- */
      var win    = document.getElementById('win');
      var vid    = document.getElementById('vid');
      var bar    = document.getElementById('dragbar');
      var grip   = document.getElementById('grip');
      var bPlay  = document.getElementById('btnPlay');
      var bPause = document.getElementById('btnPause');
      var bStop  = document.getElementById('btnStop');
      var bPrev  = document.getElementById('btnPrev');
      var bNext  = document.getElementById('btnNext');
      var bClose = document.getElementById('btnClose');
      var bMute  = document.getElementById('btnMute');
      var volEl  = document.getElementById('vol');
      var volFill = document.getElementById('volFill');

      var LISTA = ['video_1.mp4', 'video_2.mp4'];
      var idx = 0;
      var mode = 'stopped';          // 'stopped' | 'playing' | 'paused'
      var token = 0;                 // evita corrida ao trocar de vídeo rápido
      var carregado = false;

      /* geometria (em px do layout; a janela inteira é escalada por "k" em telas estreitas) */
      var MIN_W = 382, MIN_H = 330, MAX_W = 1100, MAX_H = 900;
      var CHROME_H = 157;            // título + menu + controles + status
      var k = 1, W = 0, H = 0, X = 0, Y = 0, colocada = false;

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function calcK() {
        k = Math.min(1, (window.innerWidth - 8) / MIN_W);
        // em telas bem estreitas a janela é reduzida; a sobreposição de 1px esconde linhas finas entre as peças
        win.style.setProperty('--ov', k < 1 ? '-1px' : '0px');
      }

      function aplicar() {
        win.style.width  = W + 'px';
        win.style.height = H + 'px';
        var dpr = window.devicePixelRatio || 1;
        var tx = Math.round(X * dpr) / dpr, ty = Math.round(Y * dpr) / dpr;
        win.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + k + ')';
      }

      function limitarPosicao() {
        X = clamp(X, -(W * k - 140), window.innerWidth - 140);
        Y = clamp(Y, 0, window.innerHeight - 40);
      }

      function limitarTamanho() {
        var maxW = Math.max(MIN_W, Math.min(MAX_W, (window.innerWidth  - 4) / k));
        var maxH = Math.max(MIN_H, Math.min(MAX_H, (window.innerHeight - 4) / k));
        W = clamp(W, MIN_W, maxW);
        H = clamp(H, MIN_H, maxH);
      }

      function tamanhoInicial() {
        var availW = (window.innerWidth  - 16) / k;
        var availH = (window.innerHeight - 16) / k;
        var w = Math.min(640, availW);
        var h = CHROME_H + 3 + (w - 42) * 0.75;           // tela do vídeo em 4:3
        if (h > availH) { h = availH; w = (h - CHROME_H - 3) / 0.75 + 42; }
        W = Math.max(MIN_W, Math.round(w));
        H = Math.max(MIN_H, Math.round(CHROME_H + 3 + (W - 42) * 0.75));
        limitarTamanho();
      }

      function centralizar() {
        X = (window.innerWidth  - W * k) / 2;
        Y = (window.innerHeight - H * k) / 2;
      }

      window.addEventListener('resize', function () {
        if (!colocada) return;
        calcK(); limitarTamanho(); limitarPosicao(); aplicar();
      });

      function abrirPlayer() {
        calcK();
        if (!colocada) { tamanhoInicial(); centralizar(); colocada = true; }
        else { limitarTamanho(); limitarPosicao(); }
        aplicar();
        win.setAttribute('aria-hidden', 'false');
        // força o navegador a registrar o estado "fechado" antes de animar a abertura
        void win.offsetWidth;
        win.classList.add('open');
        if (!carregado) { carregado = true; carregarVideo(idx, true); }
      }

      var fechando = false;
      function fecharPlayer() {
        if (fechando) return;
        fechando = true; ocupado = true;
        parar();
        win.classList.remove('open');
        win.setAttribute('aria-hidden', 'true');
        setTimeout(function () {
          texto.classList.add('visivel');
          setTimeout(function () { ocupado = false; fechando = false; }, FADE_IN_MS);
        }, WIN_OUT_MS);
      }
      bClose.addEventListener('click', fecharPlayer);

      /* ---- arrastar a janela pela barra de título ---- */
      var drag = null;
      bar.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.hs')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x0: X, y0: Y };
        bar.setPointerCapture(e.pointerId);
        win.classList.add('dragging');
        e.preventDefault();
      });
      bar.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.id) return;
        X = drag.x0 + (e.clientX - drag.sx);
        Y = drag.y0 + (e.clientY - drag.sy);
        limitarPosicao(); aplicar();
      });
      function soltarArrasto(e) {
        if (!drag || e.pointerId !== drag.id) return;
        drag = null; win.classList.remove('dragging');
      }
      bar.addEventListener('pointerup', soltarArrasto);
      bar.addEventListener('pointercancel', soltarArrasto);

      /* ---- redimensionar pelo cantinho (canto inferior direito) ---- */
      var rs = null;
      grip.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        rs = { id: e.pointerId, sx: e.clientX, sy: e.clientY, w0: W, h0: H };
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      grip.addEventListener('pointermove', function (e) {
        if (!rs || e.pointerId !== rs.id) return;
        var maxW = Math.max(MIN_W, Math.min(MAX_W, (window.innerWidth  - X) / k));
        var maxH = Math.max(MIN_H, Math.min(MAX_H, (window.innerHeight - Y) / k));
        W = clamp(rs.w0 + (e.clientX - rs.sx) / k, MIN_W, maxW);
        H = clamp(rs.h0 + (e.clientY - rs.sy) / k, MIN_H, maxH);
        aplicar();
      });
      function soltarResize(e) { if (rs && e.pointerId === rs.id) rs = null; }
      grip.addEventListener('pointerup', soltarResize);
      grip.addEventListener('pointercancel', soltarResize);

      /* ---- vídeo ---- */
      function setMode(m) {
        mode = m;
        bPlay.classList.toggle('on', m === 'playing');
        bPause.classList.toggle('on', m === 'paused');
      }

      function carregarVideo(i, primeira) {
        var meu = ++token;
        idx = i;
        vid.pause();
        vid.classList.add('hide');                       // fade out suave do vídeo atual
        setTimeout(function () {
          if (meu !== token) return;
          vid.onloadeddata = function () {
            if (meu !== token) return;
            vid.onloadeddata = null;
            vid.classList.remove('hide');                // fade in do novo vídeo
            if (mode === 'playing') tocarVideo();        // respeita o que o usuário apertou enquanto carregava
          };
          vid.src = LISTA[i] + '#t=0.001';
          vid.load();
        }, primeira ? 0 : 400);
      }

      function tocarVideo() {
        setMode('playing');
        var p = vid.play();
        if (p && p.catch) p.catch(function () { if (mode === 'playing') setMode('paused'); });
      }
      function pausarVideo() {
        if (mode !== 'playing') return;
        vid.pause();
        setMode('paused');
      }
      function parar() {
        vid.pause();
        try { vid.currentTime = 0; } catch (err) {}
        setMode('stopped');
      }
      function ir(delta) {
        var n = LISTA.length;
        var tocando = (mode === 'playing');
        setMode(tocando ? 'playing' : 'stopped');
        carregarVideo((idx + delta + n) % n, false);
      }

      bPlay.addEventListener('click',  function () { if (mode !== 'playing') tocarVideo(); });
      bPause.addEventListener('click', pausarVideo);
      bStop.addEventListener('click',  parar);
      bPrev.addEventListener('click',  function () { ir(-1); });
      bNext.addEventListener('click',  function () { ir(1); });

      vid.addEventListener('ended', function () {
        if (idx < LISTA.length - 1) ir(1); else parar();
      });
      // se o navegador pausar por conta própria (ex.: ligação no celular), o botão acompanha
      vid.addEventListener('pause', function () {
        if (mode === 'playing' && !vid.ended && vid.readyState > 0 && !vid.seeking) {
          // só atualiza se não estivermos no meio de uma troca de vídeo
          if (!vid.classList.contains('hide')) setMode('paused');
        }
      });

      /* ---- volume ---- */
      var vol = 0.7, mudo = false, VOL_PX = 79;
      function aplicarVolume() {
        vid.volume = vol;
        vid.muted = mudo;
        var v = mudo ? 0 : vol;
        volFill.style.width = Math.round(v * VOL_PX) + 'px';
        bMute.classList.toggle('off', mudo || vol === 0);
        volEl.setAttribute('aria-valuenow', String(Math.round(v * 100)));
      }
      function volumeDoPonteiro(e) {
        var r = volEl.querySelector('.vol-track').getBoundingClientRect();
        var v = (e.clientX - (r.left + k)) / (VOL_PX * k);
        vol = clamp(v, 0, 1);
        mudo = false;
        aplicarVolume();
      }
      var vd = null;
      volEl.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        vd = e.pointerId;
        volEl.setPointerCapture(e.pointerId);
        volEl.classList.add('drag');
        volumeDoPonteiro(e);
        e.preventDefault();
      });
      volEl.addEventListener('pointermove', function (e) { if (vd === e.pointerId) volumeDoPonteiro(e); });
      function soltarVol(e) { if (vd === e.pointerId) { vd = null; volEl.classList.remove('drag'); } }
      volEl.addEventListener('pointerup', soltarVol);
      volEl.addEventListener('pointercancel', soltarVol);
      volEl.addEventListener('keydown', function (e) {
        var d = 0;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = 0.05;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') d = -0.05;
        else if (e.key === 'Home') { vol = 0; d = 0; }
        else if (e.key === 'End')  { vol = 1; d = 0; }
        else return;
        vol = clamp(vol + d, 0, 1); mudo = false; aplicarVolume();
        e.preventDefault();
      });
      bMute.addEventListener('click', function () {
        if (mudo || vol === 0) { mudo = false; if (vol === 0) vol = 0.7; }
        else mudo = true;
        aplicarVolume();
      });
      aplicarVolume();
    })();
  </script>
</body>
</html>

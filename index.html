<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>degottlich</title>
  <meta name="description" content="Uma página artística pessoal.">
  <style>
    :root {
      /* Tamanho de 1 pixel do design original na tela atual (mesma escala do fundo "cover") */
      --s: max(100vw / 1366, 100dvh / 768);
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }

    /* Design original (desing_site.png) como fundo, sem alterações */
    .stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000 url("desing_site.png") center / cover no-repeat;
      overflow: hidden;
    }

    /* Faixas ornamentadas sempre coladas no topo e na base, em qualquer tela */
    .faixa {
      position: fixed;
      left: 0;
      right: 0;
      height: calc(var(--s) * 34);
      background-color: #000;
      background-image: url("desing_site.png");
      background-size: calc(var(--s) * 1366) auto;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 2;
    }
    .faixa.topo  { top: 0;    background-position: center top; }
    .faixa.base  { bottom: 0; background-position: center bottom; }

    /* GIF no meio da página, sem borda */
    .gif {
      display: block;
      width: min(230px, 55vw);
      height: auto;
      aspect-ratio: 1 / 1;
      border: 0;
      opacity: 0;
      animation: aparecer 1.6s ease-out 0.3s forwards;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gif { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="faixa topo" aria-hidden="true"></div>
  <main class="stage">
    <img class="gif" src="save_your_life.gif" alt="Criança acenando em cima de um quadriciclo vermelho" width="230" height="230">
  </main>
  <div class="faixa base" aria-hidden="true"></div>
</body>
</html>

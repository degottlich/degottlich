<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página artística</title>
  <meta name="description" content="Uma página artística pessoal.">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }

    /* Design original (desing_site.png) como fundo, sem alterações */
    .stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000 url("desing_site.png") center / cover no-repeat;
      overflow: hidden;
    }

    /* GIF no meio da página */
    .gif {
      display: block;
      width: min(300px, 70vw);
      height: auto;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(226, 170, 80, 0.55);
      box-shadow:
        0 0 24px rgba(214, 110, 40, 0.35),
        0 0 80px rgba(214, 110, 40, 0.15);
      opacity: 0;
      animation: aparecer 1.6s ease-out 0.3s forwards;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gif { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="gif" src="save_your_life.gif" alt="Criança acenando em cima de um quadriciclo vermelho" width="300" height="300">
  </main>
</body>
</html>
